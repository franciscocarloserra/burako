<style>

</style></head><body>
<div id="xlhead"><div>Book1 - Excel</div><div class="tabs"><span>File</span><span>Home</span><span>Insert</span><span>Formulas</span><span>Data</span><span>Review</span></div><div class="fx">fx&nbsp;&nbsp;=SUM(B2:B14)</div><div class="cols"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span></div></div>

<script type="module">
window.onerror = window.onunhandledrejection = e => toast('error: ' + (e.reason || e.message || e));
import {joinRoom} from './trystero-nostr.mjs?v=2026-10-30.1';
import * as G from './game.js?v=2026-10-30.1';
import {botStep} from './bot.js?v=2026-10-30.1';

const VERSION = '2026-10-30.1';

// Tunable parameters
const P = {
  appId: 'burako-p2p-4d1e8b',
  relayUrls: ['wss://nos.lol', 'wss://relay.primal.net', 'wss://nostr.mom'],
  randomBytes: 16,
  maxPayloadBytes: 65536,
  maxChat: 100,
  maxChatLen: 200,
  versionPollMs: 60000,
  toastMs: 2200,
  blipGain: 0.04,
  botMs: 700,
  cascadeMs: 9000,      // end-of-hand bouncing tiles, tap to skip
  cascadeGravity: 0.45,
  cascadeBounce: 0.78,
  cascadeEvery: 7,      // frames between launches
  dragPx: 8,            // pointer travel before a hand tile starts dragging
  aloneAskMs: 60000,    // alone in an old game this long: offer a new one
};
// UI text is English; ES maps each English string to Spanish for Spanish browsers
const ES = {
  'connecting...': 'conectando...', 'update': 'actualizar', 'home': 'inicio', 'Copy link': 'Copiar link', 'New game': 'Partida nueva',
  'waiting for opponent...': 'esperando rival...', 'pile': 'pozo', 'dead hands': 'muertos', 'Undo': 'Deshacer', 'Meld': 'Bajar',
  'Discard': 'Descartar', 'Sort': 'Ordenar', 'tease...': 'molestar...', 'Book1 - Excel': 'Libro1 - Excel',
  'File': 'Archivo', 'Home': 'Inicio', 'Insert': 'Insertar', 'Formulas': 'Fórmulas', 'Data': 'Datos', 'Review': 'Revisar', 'fx\u00a0\u00a0=SUM(B2:B14)': 'fx\u00a0\u00a0=SUMA(B2:B14)',
  'pick tiles to add': 'elegí fichas para agregar', 'taking a seat...': 'sentándose...', 'send the link to your opponent': 'pasale el link a tu rival',
  'hand over': 'mano terminada', 'your turn: draw from the deck or the pile': 'tu turno: robá del mazo o del pozo',
  'lay down melds and discard one': 'bajá juegos y descartá una', '{0}\'s turn': 'turno de {0}', ' (offline)': ' (desconectado)',
  'Nobody here yet. Send the link to your opponent or start another game.': 'Nadie conectado todavía. Pasale el link a tu rival o empezá otra partida.',
  'Your opponent is offline. The game is saved; you can wait or start another.': 'Tu rival no está conectado. La partida sigue guardada; podés esperarlo o empezar otra.',
  ' · with dead hand': ' · con muerto', '{0} pts': '{0} pts', ' (partner)': ' (compa)', 'deck {0}': 'mazo {0}', 'pile {0}': 'pozo {0}',
  'By color': 'Por color', 'By number': 'Por número', 'Hand {0}': 'Mano {0}',
  'melds': 'juegos', 'canastas': 'canastas', 'going out': 'cierre', 'in hand': 'mano', 'dead hand': 'muerto', 'total': 'total', 'running total': 'acumulado',
  'New hand': 'Nueva mano', 'View table': 'Ver mesa', 'Where does the wild go?': '¿Dónde va el comodín?', 'Who are you?': '¿Quién sos?', 'I\'m {0}': 'Soy {0}',
  'Your opponent isn\'t showing up': 'Tu rival no aparece', 'Keep waiting': 'Seguir esperando', 'your name': 'tu nombre', 'Play': 'Jugar',
  'Partner': 'Compa', 'Opponent 1': 'Rival 1', 'Opponent 2': 'Rival 2', 'link copied': 'link copiado',
  'Online with link': 'Online con link', 'Practice vs bot': 'Práctica vs bot', '2 vs 2 with bots': '2 vs 2 con bots',
  '🐢 hurry up already': '🐢 dale que es para hoy', '😜 I\'m gonna beat you': '😜 te voy a ganar', '👉 poke': '👉 pinchar', '🤡 clown move': '🤡 jugada de payaso', '🔥 sick move': '🔥 tremenda',
  // game.js errors and log
  'keep a tile: you can\'t go out without a canasta': 'quedate con fichas: sin canasta no podés cerrar', 'you need a canasta to go out': 'necesitás una canasta para cerrar',
  'the hand isn\'t over': 'la mano no terminó', 'not your turn': 'no es tu turno', 'you already drew': 'ya robaste', 'the pile is empty': 'el pozo está vacío',
  'draw first': 'primero robá', 'not a valid meld': 'ese juego no vale', 'invalid tiles': 'fichas inválidas', 'invalid meld': 'juego inválido',
  'doesn\'t fit that meld': 'no entra en ese juego', 'invalid tile': 'ficha inválida', 'nothing to undo': 'nada para deshacer', 'unknown action': 'acción desconocida',
  'hand {0}': 'mano {0}', '{0} took the dead hand': '{0} tomó el muerto', '{0} drew from the deck': '{0} robó del mazo', '{0} took the pile ({1})': '{0} levantó el pozo ({1})',
  '{0} laid down a meld': '{0} bajó un juego', '{0} added to a meld': '{0} agregó a un juego', '{0} discarded': '{0} tiró', '{0} undid': '{0} deshizo',
  'the deck ran out': 'se acabó el mazo', '{0} went out': '{0} cerró',
};
const LANG = navigator.language.startsWith('es') ? 'es' : 'en';
const fill = (k, a) => a.reduce((x, v, i) => x.replace('{' + i + '}', v), k);
const t = (k, ...a) => fill((LANG === 'es' && ES[k]) || k, a);
// ev is stale when an older client wrote only log
const log = () => s.ev && fill(s.ev[0], s.ev.slice(1)) === s.log ? t(...s.ev) : s.log;
const TEASES = ['🐢 hurry up already', '😜 I\'m gonna beat you', '👉 poke', '💋', '😴', '🤡 clown move', '🔥 sick move', '😂'].map(x => t(x)), POKE = 2;
const $ = id => document.getElementById(id);
// Static HTML text
document.documentElement.lang = LANG;
document.querySelectorAll('#xlhead *, #bar *, #lobby button, #oppName, .lbl, #acts button').forEach(e => { if (!e.children.length && e.textContent) e.textContent = t(e.textContent); });
$('bUndo').title = t('Undo'); $('ct').placeholder = t('tease...');
let aloneTimer = 0, aloneAsked = false;

// Online: room and password live in the URL hash #room:password (password encrypts signaling; WebRTC itself is end-to-end).
// Local practice: #solo (vs bot) or #2v2 (you + bot partner vs two bots).
const rand = () => [...crypto.getRandomValues(new Uint8Array(P.randomBytes))].map(b => b.toString(16).padStart(2, '0')).join('');
const MODE = location.hash === '#solo' ? 'solo' : location.hash === '#2v2' ? '2v2' : /^#[^:]+:.+/.test(location.hash) ? 'online' : 'menu';
const ONLINE = MODE === 'online';
addEventListener('hashchange', () => location.reload());
const [room, ...pw] = decodeURIComponent(location.hash.slice(1)).split(':');
const KEY = 'burako:' + (ONLINE ? room : MODE);
if (!ONLINE) { localStorage.setItem(KEY + ':me', 'me'); $('chatBtn').style.display = $('copy').style.display = 'none'; }

// Identity is per device (localStorage), so resume works after drops, reloads and redeploys
let me = localStorage.getItem(KEY + ':me') || rand();
localStorage.setItem(KEY + ':me', me);
let myName = localStorage.getItem('burako:name') || '';
let s = G.migrate(JSON.parse(localStorage.getItem(KEY + ':state') || 'null'));
let chat = JSON.parse(localStorage.getItem(KEY + ':chat') || '[]');
let sel = new Set(), sortBy = localStorage.getItem('burako:sort') || 'color', seen = new Set(), chatOpen = false, unread = 0;

const cfg = {appId: P.appId, password: pw.join(':')};
if (P.relayUrls.length) cfg.relayConfig = {urls: P.relayUrls};
const noop = {send() {}};
const r = ONLINE ? joinRoom(cfg, room) : {getPeers: () => ({}), makeAction: () => noop};
const stAct = r.makeAction('st'), chatAct = r.makeAction('chat'), pokeAct = r.makeAction('poke');

const seat = () => s ? s.players.findIndex(p => p.id === me) : -1;
const save = () => { localStorage.setItem(KEY + ':state', JSON.stringify(s)); localStorage.setItem(KEY + ':chat', JSON.stringify(chat)); };
const newer = (a, b) => !b || a.v > b.v || (a.v === b.v && a.id < b.id);
function commit() { s.v++; save(); stAct.send(JSON.stringify(s)); render(); }

function parse(raw) {
  if (typeof raw !== 'string' || raw.length > P.maxPayloadBytes) return null;
  try { const o = JSON.parse(raw); return o && typeof o === 'object' && !Array.isArray(o) ? o : null; } catch { return null; }
}

// Sit down if there is a free seat; the second player to sit deals
function claim() {
  if (!ONLINE || !myName || !s || seat() >= 0 || s.players.length >= 2) return;
  s.players.push({id: me, name: myName});
  if (s.players.length === 2 && s.phase === 'waiting') G.deal(s);
  commit();
}

stAct.onMessage = raw => {
  const o = parse(raw);
  if (!o || o.schema !== 1 || !Array.isArray(o.players) || !newer(o, s)) return;
  const myTurnBefore = isMyTurn(), wasOver = s?.phase === 'over';
  s = G.migrate(o); save(); claim(); render();
  if (!myTurnBefore && isMyTurn()) blip(660);
  if (!wasOver && s.phase === 'over') showScore();
  if (seat() < 0 && s.players.length >= 2 && !$('modal').className) askSeat();
};
chatAct.onMessage = raw => {
  const o = parse(raw);
  if (Array.isArray(o?.list)) return o.list.forEach(addChat);
  if (o) { addChat(o); blip(990); }
};
pokeAct.onMessage = raw => { const o = parse(raw); if (o && typeof o.e === 'string') tease(o.e.slice(0, 8), o.shake === true); };

r.onPeerJoin = peer => {
  status();
  if (s) stAct.send(JSON.stringify(s), {target: peer});
  if (chat.length) chatAct.send(JSON.stringify({list: chat}), {target: peer});
};
r.onPeerLeave = () => status();

function addChat(m) {
  if (typeof m?.id !== 'string' || typeof m.text !== 'string' || typeof m.from !== 'string' || chat.some(c => c.id === m.id)) return;
  chat.push({id: m.id, from: m.from.slice(0, 30), by: String(m.by ?? ''), text: m.text.slice(0, P.maxChatLen), ts: +m.ts || 0});
  chat.sort((a, b) => a.ts - b.ts);
  while (chat.length > P.maxChat) chat.shift();
  if (!chatOpen && m.by !== me) unread++;
  save(); renderChat();
}

const isMyTurn = () => s && seat() >= 0 && s.turn === seat() && (s.phase === 'draw' || s.phase === 'play');

function play(a) {
  const err = G.act(s, seat(), a);
  if (err) { toast(t(err)); return false; }
  sel.clear(); commit();
  if (s.phase === 'over') showScore();
  return true;
}

// --- rendering
function tile(id, extra = '') {
  const d = document.createElement('div'), c = G.color(id);
  d.className = 'tile c' + c + extra;
  d.textContent = c === 4 ? '☻' : G.num(id);
  return d;
}
// sortBy 'custom': the order the player dragged into; tiles not in it go last, by color
let custom = JSON.parse(localStorage.getItem(KEY + ':order') || '[]'), dragged = 0;
const order = ids => [...ids].sort(sortBy === 'custom'
  ? (a, b) => ((custom.indexOf(a) + 1 || 1e3) - (custom.indexOf(b) + 1 || 1e3)) || G.color(a) - G.color(b) || G.num(a) - G.num(b)
  : sortBy === 'color' ? (a, b) => G.color(a) - G.color(b) || G.num(a) - G.num(b)
  : (a, b) => G.num(a) - G.num(b) || G.color(a) - G.color(b));

function meldEl(m, i, mine) {
  const d = document.createElement('div');
  d.className = 'meld' + (G.isCanasta(m) ? ' can' + (m.w ? '' : ' clean') : '');
  d.append(...m.t.map(id => tile(id)));
  if (mine && sel.size && G.validate([...m.t, ...sel])) d.className += ' fit';
  if (mine) d.onclick = () => sel.size ? withWildSide([...m.t, ...sel], low => play({type: 'add', meld: i, ids: [...sel], low}), m.low) : toast(t('pick tiles to add'));
  return d;
}

function status() {
  const peers = Object.keys(r.getPeers()).length;
  $('dot').className = peers ? 'on' : '';
  let msg;
  if (!ONLINE) $('dot').className = 'on';
  if (!s || s.phase === 'waiting') msg = peers ? t('taking a seat...') : t('send the link to your opponent');
  else if (s.phase === 'over') msg = t('hand over') + ' · ' + log();
  else if (isMyTurn()) msg = t(s.phase === 'draw' ? 'your turn: draw from the deck or the pile' : 'lay down melds and discard one');
  else msg = t('{0}\'s turn', s.players[s.turn]?.name ?? '?') + (peers || !ONLINE ? '' : t(' (offline)'));
  // Online with nobody else here: say so plainly and offer a fresh game
  const alone = ONLINE && !peers, playing = s && s.phase !== 'waiting';
  $('lobby').className = alone ? 'on' : '';
  if (!alone || !playing) clearTimeout(aloneTimer), aloneTimer = 0;
  else if (!aloneTimer && !aloneAsked) aloneTimer = setTimeout(askAlone, P.aloneAskMs);
  $('lobbyT').textContent = t(!playing ? 'Nobody here yet. Send the link to your opponent or start another game.'
    : 'Your opponent is offline. The game is saved; you can wait or start another.');
  $('status').textContent = msg + (s?.log && s.phase !== 'over' ? ' · ' + log() : '');
}

function render() {
  status();
  const p = seat();
  if (!s || p < 0) return;
  const mt = G.team(p), o = 1 - mt, n = s.n ?? 2, back = () => Object.assign(document.createElement('div'), {className: 'back'});
  document.body.classList.toggle('n4', n === 4);
  $('oppName').textContent = s.players.length > 1 ? teamName(o) + (s.muerto[o] ? t(' · with dead hand') : '') : t('waiting for opponent...');
  $('myName').textContent = teamName(mt) + (s.muerto[mt] ? t(' · with dead hand') : '');
  $('oppScore').textContent = s.players.length > 1 ? t('{0} pts', s.scores[o]) : '';
  $('myScore').textContent = t('{0} pts', s.scores[mt]);
  $('oppHand').replaceChildren(...[...Array(n).keys()].filter(q => q !== p && s.players[q]).map(q => {
    const w = Object.assign(document.createElement('div'), {className: 'rack' + (s.turn === q ? ' turn' : '')});
    const b = Object.assign(document.createElement('div'), {className: 'backs'});
    b.append(...s.hands[q].map(back));
    w.append(s.players[q].name + (G.team(q) === mt ? t(' (partner)') : ''), b);
    return w;
  }));
  $('oppMelds').replaceChildren(...s.melds[o].map((m, i) => meldEl(m, i, false)));
  $('myMelds').replaceChildren(...s.melds[mt].map((m, i) => meldEl(m, i, true)));
  $('mazoN').textContent = t('deck {0}', s.mazo.length);
  $('pozo').replaceChildren(...s.pozo.slice(-5).map(id => tile(id)));
  $('pozoN').textContent = t('pile {0}', s.pozo.length);
  $('muertos').replaceChildren(...s.muertos.map(() => Object.assign(document.createElement('div'), {className: 'back'})));
  for (const id of sel) if (!s.hands[p].includes(id)) sel.delete(id);
  $('hand').replaceChildren(...order(s.hands[p]).map(id => {
    const d = tile(id, (sel.has(id) ? ' sel' : '') + (seen.size && !seen.has(id) ? ' new' : ''));
    d.onclick = () => { if (Date.now() - dragged < 300) return; sel.has(id) ? sel.delete(id) : sel.add(id); render(); };
    d.onpointerdown = e => dragTile(e, id, d);
    d.dataset.id = id;
    return d;
  }));
  seen = new Set(s.hands[p]);
  const play_ = isMyTurn() && s.phase === 'play';
  $('bMeld').disabled = !play_ || sel.size < 3;
  $('bDisc').disabled = !play_ || sel.size !== 1;
  $('bUndo').disabled = !play_;
  $('bSort').textContent = t(sortBy === 'color' ? 'By color' : sortBy === 'num' ? 'By number' : 'Sort');
  botLoop();
}
const teamName = T => s.players.filter((_, q) => G.team(q) === T).map(x => x.name).join(' + ');

// Local modes: bots play their turns with a small delay so moves are visible
let botT = null;
function botLoop() {
  const q = s?.turn;
  if (ONLINE || botT || !s.players[q]?.bot || (s.phase !== 'draw' && s.phase !== 'play')) return;
  botT = setTimeout(() => {
    botT = null;
    if (G.act(s, q, botStep(s, q))) G.act(s, q, {type: 'discard', id: s.hands[q].at(-1)});
    commit();
    if (s.phase === 'over') showScore();
  }, P.botMs);
}

function renderChat() {
  $('msgs').replaceChildren(...chat.map(m => {
    const d = document.createElement('div');
    d.className = 'm' + (m.by === me ? ' me' : '');
    d.textContent = (m.by === me ? '' : m.from + ': ') + m.text;
    return d;
  }));
  $('msgs').scrollTop = $('msgs').scrollHeight;
  $('unread').textContent = unread;
  $('unread').style.display = unread ? 'block' : 'none';
  const last = chat.at(-1);
  if (!chatOpen && last && last.by !== me && Date.now() - last.ts < 5000) toast(last.from + ': ' + last.text);
}

// End of hand: the table's tiles bounce off the screen leaving trails, solitaire style
function cascade(done) {
  const els = [...document.querySelectorAll('.meld .tile, #hand .tile')];
  if (!els.length || document.body.classList.contains('xl') || matchMedia('(prefers-reduced-motion: reduce)').matches) return done();
  const c = document.createElement('canvas'), g = c.getContext('2d'), dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:11';
  g.scale(dpr, dpr);
  document.body.append(c);
  const todo = els.map(e => {
    const r = e.getBoundingClientRect(), dir = Math.random() < .5 ? -1 : 1;
    return {x: r.left, y: r.top, w: r.width, h: r.height, txt: e.textContent, col: getComputedStyle(e).color,
      vx: dir * (2 + Math.random() * 4), vy: -Math.random() * 6};
  }).sort(() => Math.random() - .5);
  const live = [], t0 = performance.now();
  let f = 0, end = false;
  const finish = () => { if (end) return; end = true; c.remove(); done(); };
  c.onclick = finish;
  function draw(o) {
    const r = o.w * .16;
    g.fillStyle = '#b9a77c'; g.beginPath(); g.roundRect(o.x, o.y + 2, o.w, o.h, r); g.fill();
    g.fillStyle = '#fffdf7'; g.beginPath(); g.roundRect(o.x, o.y, o.w, o.h, r); g.fill();
    g.fillStyle = o.col; g.font = '900 ' + Math.round(o.w * .58) + 'px "Arial Black",Arial,sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'top'; g.fillText(o.txt, o.x + o.w / 2, o.y + o.h * .18);
  }
  (function step() {
    if (end) return;
    if (f++ % P.cascadeEvery === 0 && todo.length) live.push(todo.pop());
    for (const o of live) {
      o.vy += P.cascadeGravity; o.x += o.vx; o.y += o.vy;
      if (o.y + o.h > H) { o.y = H - o.h; o.vy *= -P.cascadeBounce; }
      draw(o);
    }
    for (let i = live.length - 1; i >= 0; i--) if (live[i].x > W || live[i].x + live[i].w < 0) live.splice(i, 1);
    if ((!todo.length && !live.length) || performance.now() - t0 > P.cascadeMs) return finish();
    requestAnimationFrame(step);
  })();
}

function showScore() { cascade(scoreModal); }
function scoreModal() {
  const rows = {juegos: 'melds', canastas: 'canastas', cierre: 'going out', mano: 'in hand', muerto: 'dead hand', total: 'total'};
  const L = s.last || [{}, {}];
  $('mbody').innerHTML = '<b>' + t('Hand {0}', s.round) + '</b><table><tr><td></td><td></td><td></td></tr>'
    + Object.entries(rows).map(([k, l]) => '<tr><td>' + t(l) + '</td>' + L.map(x => '<td>' + (x[k] ?? '') + '</td>').join('') + '</tr>').join('')
    + '<tr><td>' + t('running total') + '</td>' + s.scores.map(x => '<td><b>' + x + '</b></td>').join('') + '</tr></table>';
  const tds = $('mbody').querySelectorAll('tr:first-child td');
  [0, 1].forEach(T => tds[T + 1].textContent = teamName(T));
  const b = Object.assign(document.createElement('button'), {textContent: t('New hand')});
  b.onclick = () => { $('modal').className = ''; if (s.phase === 'over') play({type: 'next'}); };
  const c = Object.assign(document.createElement('button'), {textContent: t('View table')});
  c.style.background = '#444';
  c.onclick = () => $('modal').className = '';
  $('mbody').append(b, c);
  $('modal').className = 'on';
}

// A wild that fits on either end of a run: let the player pick the end
function withWildSide(ids, go, cur) {
  const hi = G.validate(ids, false), lo = G.validate(ids, true);
  if (!hi || !lo || hi.t.join() === lo.t.join() || ids.length === 0) return go(cur);
  const opt = (m, low) => {
    const b = document.createElement('button');
    b.style.cssText = 'display:flex;gap:2px;justify-content:center;background:#0004';
    b.append(...m.t.map(id => tile(id)));
    b.onclick = () => { $('modal').className = ''; go(low); };
    return b;
  };
  $('mbody').replaceChildren(Object.assign(document.createElement('b'), {textContent: t('Where does the wild go?')}), opt(lo, true), opt(hi, false));
  $('mbody').querySelectorAll('.tile').forEach(x => x.style.setProperty('--tw', '26px'));
  $('modal').className = 'on';
}

// Seat taken by someone else: let a device that lost its storage take over a seat
function askSeat() {
  $('mbody').replaceChildren(Object.assign(document.createElement('b'), {textContent: t('Who are you?')}),
    ...s.players.map(p => {
      const b = Object.assign(document.createElement('button'), {textContent: t('I\'m {0}', p.name)});
      b.onclick = () => { me = p.id; myName = p.name; localStorage.setItem(KEY + ':me', me); localStorage.setItem('burako:name', myName); $('modal').className = ''; render(); };
      return b;
    }));
  $('modal').className = 'on';
}

// Drag a hand tile onto another to put it in that spot; switches the hand to custom order
function dragTile(e, id, d) {
  const x0 = e.clientX, y0 = e.clientY;
  let moved = false;
  const move = ev => {
    if (!moved && Math.hypot(ev.clientX - x0, ev.clientY - y0) < P.dragPx) return;
    moved = true; d.classList.add('drag');
    d.style.transform = `translate(${ev.clientX - x0}px,${ev.clientY - y0}px)`;
  };
  const up = ev => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    if (!moved) return;
    dragged = Date.now();
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const ids = [...$('hand').children].map(c => +c.dataset.id);
    const to = el?.closest('#hand .tile') ? ids.indexOf(+el.closest('.tile').dataset.id) : el?.closest('#hand') ? ids.length - 1 : -1;
    if (to >= 0) {
      ids.splice(ids.indexOf(id), 1); ids.splice(to, 0, id);
      custom = ids; sortBy = 'custom'; localStorage.setItem('burako:sort', sortBy);
      localStorage.setItem(KEY + ':order', JSON.stringify(ids));
    }
    render();
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
}

function askAlone() {
  if ($('modal').className) return aloneTimer = setTimeout(askAlone, P.aloneAskMs);
  aloneAsked = true;
  const n = Object.assign(document.createElement('button'), {textContent: t('New game')});
  const w = Object.assign(document.createElement('button'), {textContent: t('Keep waiting')});
  n.onclick = () => location.hash = rand() + ':' + rand();
  w.onclick = () => $('modal').className = '';
  $('mbody').replaceChildren(Object.assign(document.createElement('b'), {textContent: t('Your opponent isn\'t showing up')}), n, w);
  $('modal').className = 'on';
}

function askName() {
  const i = Object.assign(document.createElement('input'), {placeholder: t('your name'), maxLength: 20});
  const b = Object.assign(document.createElement('button'), {textContent: t('Play')});
  b.onclick = () => {
    const n = i.value.trim();
    if (!n) return;
    myName = n; localStorage.setItem('burako:name', n); $('modal').className = '';
    start();
  };
  $('mbody').replaceChildren(Object.assign(document.createElement('b'), {textContent: 'Burako'}), i, b);
  $('modal').className = 'on';
  i.focus();
}

function start() {
  if (!s && !ONLINE) {
    const bots = MODE === 'solo' ? ['Bot'] : ['Opponent 1', 'Partner', 'Opponent 2'].map(x => t(x));
    s = G.newState(rand(), {id: me, name: myName}, bots.length + 1);
    bots.forEach((b, i) => s.players.push({id: 'bot' + i, name: b, bot: true}));
    G.deal(s); save();
  }
  if (!s) { s = G.newState(rand(), {id: me, name: myName}); save(); stAct.send(JSON.stringify(s)); }
  claim(); render(); renderChat();
  if (s.phase === 'over') scoreModal();
}

// --- fun
let ac;
addEventListener('pointerdown', () => { ac ??= new AudioContext(); ac.resume(); });
function blip(f) {
  if (!ac || ac.state !== 'running' || document.body.classList.contains('xl')) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.frequency.value = f; g.gain.setValueAtTime(P.blipGain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .12);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .12);
}
function tease(e, shake) {
  if (document.body.classList.contains('xl')) return;
  const d = Object.assign(document.createElement('div'), {className: 'fly', textContent: e});
  d.style.left = 15 + Math.random() * 70 + 'vw';
  document.body.append(d); setTimeout(() => d.remove(), 2300);
  if (shake) { document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); navigator.vibrate?.(200); blip(330); }
}
let toastT;
function toast(t) { $('toast').textContent = t; $('toast').className = 'on'; clearTimeout(toastT); toastT = setTimeout(() => $('toast').className = '', P.toastMs); }

function sendChat(text) {
  const m = {id: rand(), from: myName, by: me, text, ts: Date.now()};
  addChat(m); chatAct.send(JSON.stringify(m));
}
$('teases').append(...TEASES.map((x, i) => {
  const b = Object.assign(document.createElement('button'), {textContent: x});
  b.onclick = () => {
    const e = [...x][0], shake = i === POKE;
    tease(e, false); pokeAct.send(JSON.stringify({e, shake}));
    if (!shake && x.length > 2) sendChat(x);
  };
  return b;
}));
$('cf').onsubmit = e => { e.preventDefault(); const t = $('ct').value.trim(); if (t) sendChat(t); $('ct').value = ''; };
$('chatBtn').onclick = () => { chatOpen = !chatOpen; $('chat').classList.toggle('open', chatOpen); if (chatOpen) unread = 0; renderChat(); };
document.querySelector('main').onclick = () => { if (chatOpen) $('chatBtn').onclick(); };

// --- table actions
$('mazo').onclick = () => isMyTurn() && s.phase === 'draw' ? play({type: 'draw'}) : toast(t(isMyTurn() ? 'you already drew' : 'not your turn'));
$('pozoBox').onclick = () => isMyTurn() && s.phase === 'draw' ? play({type: 'pozo'}) : toast(t(isMyTurn() ? 'you already drew' : 'not your turn'));
$('bMeld').onclick = () => withWildSide([...sel], low => play({type: 'meld', ids: [...sel], low}));
$('bDisc').onclick = () => play({type: 'discard', id: [...sel][0]});
$('bUndo').onclick = () => play({type: 'undo'});
$('bSort').onclick = () => { sortBy = sortBy === 'color' ? 'num' : 'color'; localStorage.setItem('burako:sort', sortBy); render(); };
$('copy').onclick = async () => { await navigator.clipboard.writeText(location.href); toast(t('link copied')); };

// New deploys: state lives in localStorage and the peer, so reloading is safe
setInterval(async () => {
  try {
    const v = (await (await fetch('version.txt', {cache: 'no-store'})).text()).trim();
    if (v && v !== VERSION) $('upd').style.display = 'inline';
  } catch {}
}, P.versionPollMs);
$('upd').onclick = () => location.reload();
$('home').onclick = () => location.hash = '';
const stealth = on => {
  document.body.classList.toggle('xl', on);
  document.title = on ? t('Book1 - Excel') : 'burako';
  localStorage.setItem('burako:xl', on ? '1' : '');
};
stealth(!!localStorage.getItem('burako:xl'));
$('xl').onclick = () => stealth(!document.body.classList.contains('xl'));
addEventListener('keydown', e => { if (e.key === 'Escape') stealth(!document.body.classList.contains('xl')); });
$('lCopy').onclick = () => $('copy').onclick();
$('lNew').onclick = () => location.hash = rand() + ':' + rand();
setInterval(status, 3000);

function menu() {
  const opts = [['Online with link', rand() + ':' + rand()], ['Practice vs bot', 'solo'], ['2 vs 2 with bots', '2v2']];
  $('mbody').replaceChildren(Object.assign(document.createElement('b'), {textContent: 'Burako'}), ...opts.map(([l, h]) => {
    const b = Object.assign(document.createElement('button'), {textContent: t(l)});
    b.onclick = () => location.hash = h;
    return b;
  }));
  $('modal').className = 'on';
}

if (MODE === 'menu') menu();
else if (!myName) askName();
else { start(); if (ONLINE && seat() < 0 && s.players.length >= 2) askSeat(); }
</script></body></html>
